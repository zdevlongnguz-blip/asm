<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeatherBot</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ===== Token ===== */
  :root {
    --glass: rgba(255, 255, 255, .14);
    --glass-strong: rgba(255, 255, 255, .22);
    --glass-line: rgba(255, 255, 255, .30);
    --text-dim: rgba(255, 255, 255, .78);
    --sky: #7dd3fc;
    --violet: #c4b5fd;
    --radius-lg: 24px;
    --radius-md: 16px;
  }

  /* ===== Nền ===== */
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    margin: 0;
    overflow: hidden;
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .2);
    background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 55%, #9d174d 100%) fixed;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    pointer-events: none;
  }
  body::before { width: 420px; height: 420px; background: #38bdf8; top: -120px; left: -100px; }
  body::after  { width: 460px; height: 460px; background: #f472b6; bottom: -140px; right: -120px; }

  /* ===== Kính mờ ===== */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--glass-line);
    border-radius: var(--radius-lg);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .3);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(30, 27, 75, .85); }
  }

  .dim { color: var(--text-dim); }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ===== Header ===== */
  .app-header { margin: 12px 12px 0; padding: .35rem .75rem; }
  .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 12px;
    background: linear-gradient(135deg, #38bdf8, #a855f7);
    border: 1px solid rgba(255, 255, 255, .5);
  }
  .navbar-brand { font-weight: 700; letter-spacing: -.01em; }
  .navbar .nav-link { border-radius: 999px; padding: .4rem 1rem; color: var(--text-dim); font-weight: 500; }
  .navbar .nav-link:hover { color: #fff; background: rgba(255, 255, 255, .12); }
  .navbar .nav-link.active { color: #fff; background: rgba(255, 255, 255, .24); }

  /* ===== Khung chính ===== */
  .app-main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .app-grid { flex: 1; min-height: 0; margin: 0; }
  .panel { display: flex; min-height: 0; }
  .panel-inner { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    padding: .85rem 1.1rem; border-bottom: 1px solid var(--glass-line);
    background: rgba(255, 255, 255, .06);
  }
  .panel-title { font-size: 1rem; font-weight: 600; margin: 0; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; margin-right: .4rem; }
  .scroll-area {
    flex: 1; min-height: 0; overflow-y: auto; padding: 1rem;
    scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .4) transparent;
  }

  /* Mobile: tab Chat / Kết quả */
  .mobile-tabs { display: flex; padding: 4px; gap: 4px; border-radius: 999px; }
  .tab-btn {
    flex: 1; border: 0; background: transparent; color: var(--text-dim);
    padding: .5rem 1rem; border-radius: 999px; font-weight: 600; text-shadow: inherit;
  }
  .tab-btn.active { color: #fff; background: rgba(255, 255, 255, .26); }
  .tab-btn .dot { display: inline-block; width: 8px; height: 8px; margin-left: .4rem; border-radius: 50%; background: #f472b6; }
  @media (max-width: 767.98px) {
    .panel:not(.active) { display: none; }
  }

  /* ===== Chat ===== */
  .messages { display: flex; flex-direction: column; gap: 1rem; }
  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 92%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: .7rem .95rem; line-height: 1.5; border-radius: 20px;
    background: var(--glass-strong); border: 1px solid var(--glass-line);
    overflow-wrap: anywhere;
  }
  .msg.bot .bubble { border-bottom-left-radius: 6px; }
  .msg.user .bubble { background: rgba(167, 139, 250, .38); border-bottom-right-radius: 6px; }

  .tool-chip {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .15rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 600;
    background: rgba(16, 185, 129, .22); border: 1px solid rgba(52, 211, 153, .5); color: #d1fae5;
  }
  .tool-chip.running { background: rgba(125, 211, 252, .18); border-color: rgba(125, 211, 252, .5); color: #e0f2fe; }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; }

  .panel-foot { padding: .85rem 1rem; border-top: 1px solid var(--glass-line); background: rgba(255, 255, 255, .06); }
  .glass-input {
    background-color: rgba(255, 255, 255, .16);
    border: 1px solid var(--glass-line);
    color: #fff;
    border-radius: 999px;
    padding-inline: 1rem;
  }
  .glass-input::placeholder { color: rgba(255, 255, 255, .7); }
  .glass-input:focus {
    background-color: rgba(255, 255, 255, .22); color: #fff; border-color: #fff;
    box-shadow: 0 0 0 .2rem rgba(125, 211, 252, .35);
  }
  .form-select.glass-input {
    --bs-form-select-bg-img: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
  }
  .form-select.glass-input option { color: #111; }
  .btn-send {
    flex: 0 0 46px; width: 46px; border-radius: 999px; color: #fff;
    background: linear-gradient(135deg, rgba(56, 189, 248, .85), rgba(168, 85, 247, .85));
    border: 1px solid rgba(255, 255, 255, .5);
  }
  .btn-send:hover, .btn-send:focus-visible { color: #fff; filter: brightness(1.12); }
  .btn-send:disabled { opacity: .5; }
  .btn-ghost {
    color: #fff; background: rgba(255, 255, 255, .12); border: 1px solid var(--glass-line);
    border-radius: 999px; font-size: .85rem; padding: .25rem .8rem;
  }
  .btn-ghost:hover { color: #fff; background: rgba(255, 255, 255, .22); }

  /* ===== Card kết quả ===== */
  .result-card { padding: 1.15rem 1.25rem; margin-bottom: 1rem; animation: rise .35s ease both; }
  .result-card:last-child { margin-bottom: 0; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .card-title { font-size: 1rem; font-weight: 600; margin: 0; }
  .card-meta { display: flex; align-items: center; gap: .5rem; font-size: .75rem; color: var(--text-dim); }

  .temp { font-size: clamp(3rem, 8vw, 4.25rem); font-weight: 700; line-height: 1; letter-spacing: -.03em; }
  .wx-big { font-size: 4rem; line-height: 1; }
  .stat {
    height: 100%; padding: .6rem .75rem; border-radius: 14px;
    background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22);
  }
  .stat-label { font-size: .75rem; color: var(--text-dim); }
  .stat-value { font-weight: 600; }

  .wx-sun { color: #fde68a; }
  .wx-partly { color: #fef3c7; }
  .wx-cloud { color: #e2e8f0; }
  .wx-rain { color: #93c5fd; }
  .wx-storm { color: #ddd6fe; }

  .forecast-row {
    display: flex; gap: .5rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: .25rem;
    scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .4) transparent;
  }
  .day {
    flex: 1 0 96px; scroll-snap-align: start; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: .25rem;
    padding: .75rem .5rem; border-radius: 16px;
    background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .2);
  }
  .day.today { background: rgba(255, 255, 255, .22); border-color: rgba(255, 255, 255, .4); }
  .day-name { font-weight: 600; font-size: .9rem; }
  .rain { color: var(--sky); font-size: .8rem; }

  .news-list { display: flex; flex-direction: column; gap: .6rem; }
  .news-item {
    display: flex; gap: .75rem; align-items: flex-start; padding: .7rem .8rem; border-radius: 16px;
    background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .2);
  }
  .news-ico {
    flex: 0 0 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px; background: rgba(196, 181, 253, .25); border: 1px solid rgba(196, 181, 253, .45);
  }
  .news-title { font-weight: 600; line-height: 1.35; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text-dim); }
  .empty i { font-size: 2.5rem; display: block; margin-bottom: .75rem; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .result-card { animation: none; }
    .spinner-border { animation-duration: 1.5s; }
  }
</style>
</head>

<body>
  <!-- ================= HEADER ================= -->
  <header class="glass app-header">
    <nav class="navbar navbar-expand-md" data-bs-theme="dark">
      <div class="container-fluid px-1">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <span class="logo"><i class="bi bi-cloud-sun-fill"></i></span>
          WeatherBot
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Mở menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-md-auto gap-md-1 pt-2 pt-md-0">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Trang chủ</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Dự báo</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Tin tức</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ================= NỘI DUNG ================= -->
  <main class="app-main">
    <!-- Tab chỉ hiện trên mobile (dưới 768px) -->
    <div class="mobile-tabs glass d-md-none" role="tablist">
      <button class="tab-btn active" id="tab-chat" role="tab" aria-selected="true" data-target="panel-chat">Chat</button>
      <button class="tab-btn" id="tab-results" role="tab" aria-selected="false" data-target="panel-results">
        Kết quả<span class="dot" id="resultDot" hidden></span>
      </button>
    </div>

    <div class="row g-3 app-grid">
      <!-- ===== CHAT ===== -->
      <section class="col-md-5 panel active" id="panel-chat" aria-label="Chat">
        <div class="glass panel-inner">
          <div class="panel-head">
            <div>
              <h2 class="panel-title">Trợ lý thời tiết</h2>
              <small class="dim"><span class="status-dot"></span>Sẵn sàng</small>
            </div>
          </div>

          <div class="scroll-area" id="messagesArea">
            <div class="messages" id="messages" aria-live="polite"></div>
          </div>

          <div class="panel-foot">
            <label class="visually-hidden" for="testSelect">Câu hỏi test</label>
            <select id="testSelect" class="form-select form-select-sm glass-input mb-2"></select>
            <form id="chatForm" class="d-flex gap-2" autocomplete="off">
              <label class="visually-hidden" for="chatInput">Tin nhắn</label>
              <input id="chatInput" type="text" class="form-control glass-input" placeholder="Nhập tin nhắn…">
              <button class="btn btn-send" id="sendBtn" type="submit" aria-label="Gửi">
                <i class="bi bi-send-fill"></i>
              </button>
            </form>
          </div>
        </div>
      </section>

      <!-- ===== KẾT QUẢ ===== -->
      <section class="col-md-7 panel" id="panel-results" aria-label="Kết quả">
        <div class="glass panel-inner">
          <div class="panel-head">
            <h2 class="panel-title">Kết quả</h2>
            <button class="btn btn-ghost" id="clearBtn" type="button">Xoá kết quả</button>
          </div>
          <div class="scroll-area" id="results">
            <div class="empty" id="emptyState">
              <i class="bi bi-cloud-sun"></i>
              Chưa có kết quả.<br>Hỏi về thời tiết, dự báo hoặc tin tức để xem tại đây.
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* =====================================================
       1. DỮ LIỆU MẪU
       TODO: chuyển sang file public/data/test-questions.json
       ===================================================== */
    const TEST_QUESTIONS = [
      { label: 'Hà Nội hôm nay',        text: 'Thời tiết Hà Nội hôm nay thế nào?' },
      { label: 'TP.HCM có mưa không',   text: 'Bây giờ ở TP.HCM có mưa không?' },
      { label: 'Đà Nẵng 5 ngày',        text: 'Dự báo 5 ngày tới ở Đà Nẵng' },
      { label: 'Cuối tuần Đà Lạt',      text: 'Cuối tuần này Đà Lạt trời thế nào?' },
      { label: 'Tin bão',               text: 'Có tin tức gì về bão gần đây không?' },
      { label: 'Thời tiết và cảnh báo', text: 'Hà Nội hôm nay thế nào và có cảnh báo gì không?' }
    ];

    const CITIES = [
      { name: 'Hà Nội',          keys: ['hà nội', 'hanoi'],                        temp: 32, feels: 36, cond: 'Nắng nóng',   icon: 'sun',    humidity: 70, wind: 12, uv: 8, pressure: 1008 },
      { name: 'TP. Hồ Chí Minh', keys: ['hồ chí minh', 'tp.hcm', 'tp hcm', 'sài gòn'], temp: 33, feels: 38, cond: 'Có mây, mưa rào', icon: 'rain', humidity: 78, wind: 10, uv: 9, pressure: 1006 },
      { name: 'Đà Nẵng',         keys: ['đà nẵng'],                                 temp: 30, feels: 33, cond: 'Ít mây',       icon: 'partly', humidity: 72, wind: 16, uv: 7, pressure: 1010 },
      { name: 'Đà Lạt',          keys: ['đà lạt'],                                  temp: 22, feels: 22, cond: 'Trời mát, có mây', icon: 'cloud', humidity: 80, wind: 8, uv: 5, pressure: 1014 }
    ];

    const NEWS = [
      { title: 'Không khí lạnh tăng cường, nhiệt độ miền Bắc giảm 3 đến 4°C từ cuối tuần', source: 'Trung tâm Dự báo KTTV Quốc gia', time: '15 phút trước', icon: 'bi-snow2' },
      { title: 'Cảnh báo chỉ số tia cực tím ở mức cao từ 11h đến 14h tại miền Trung', source: 'VN Weather News', time: '1 giờ trước', icon: 'bi-exclamation-triangle-fill' },
      { title: 'Miền Nam nắng ban ngày, chiều tối có mưa rào cục bộ', source: 'Đài Khí tượng Thủy văn Nam Bộ', time: '3 giờ trước', icon: 'bi-cloud-drizzle-fill' }
    ];

    const ICONS = {
      sun: 'bi-sun-fill', partly: 'bi-cloud-sun-fill', cloud: 'bi-cloud-fill',
      rain: 'bi-cloud-rain-heavy-fill', storm: 'bi-cloud-lightning-rain-fill'
    };
    const DAY_NAMES = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];

    /* =====================================================
       2. MOCK GỌI CHATBOT
       Trả về đúng định dạng backend sẽ trả:
       { reply: string, toolCalls: [{ name, result }] }
       ===================================================== */
    function mockChat(text) {
      const t = text.toLowerCase();
      const city = CITIES.find(c => c.keys.some(k => t.includes(k))) || CITIES[0];

      const wantsForecast = /dự báo|ngày tới|tuần/.test(t);
      const wantsNews = /tin tức|bão|cảnh báo/.test(t);
      const wantsNow = /thời tiết|hôm nay|bây giờ|mưa|nắng|nhiệt/.test(t) || (!wantsForecast && !wantsNews);

      const toolCalls = [];
      const parts = [];

      if (wantsNow) {
        toolCalls.push({ name: 'get_weather', result: {
          city: city.name, temp: city.temp, feels: city.feels, condition: city.cond, icon: city.icon,
          humidity: city.humidity, wind: city.wind, uv: city.uv, pressure: city.pressure
        }});
        parts.push(`${city.name} đang ${city.temp}°C, ${city.cond.toLowerCase()}.`);
      }
      if (wantsForecast) {
        const shape = [
          { icon: 'partly', cond: 'Ít mây',   d: 0,  rain: 10 },
          { icon: 'rain',   cond: 'Mưa rào',  d: -3, rain: 60 },
          { icon: 'storm',  cond: 'Có dông',  d: -4, rain: 70 },
          { icon: 'sun',    cond: 'Nắng đẹp', d: 1,  rain: 20 },
          { icon: 'sun',    cond: 'Nắng',     d: 2,  rain: 10 }
        ];
        const today = new Date().getDay();
        const days = shape.map((s, i) => ({
          name: i === 0 ? 'Hôm nay' : DAY_NAMES[(today + i) % 7],
          icon: s.icon, cond: s.cond, hi: city.temp + s.d, lo: city.temp + s.d - 7, rain: s.rain
        }));
        toolCalls.push({ name: 'get_forecast', result: { city: city.name, days } });
        parts.push(`Đây là dự báo 5 ngày tới cho ${city.name}.`);
      }
      if (wantsNews) {
        toolCalls.push({ name: 'get_news', result: { items: NEWS } });
        parts.push(`Có ${NEWS.length} tin liên quan.`);
      }
      return { reply: parts.join(' '), toolCalls };
    }

    /* TODO (Copilot): thay nội dung hàm này bằng
       const res = await fetch('/api/chat', {
         method: 'POST',
         headers: { 'Content-Type': 'application/json' },
         body: JSON.stringify({ message: text })
       });
       return res.json();
    */
    async function callChat(text) {
      await new Promise(r => setTimeout(r, 700));
      return mockChat(text);
    }

    /* =====================================================
       3. HÀM RENDER CARD (mỗi tool một card)
       ===================================================== */
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const timeNow = () => new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

    function cardShell(tool, titleHtml, bodyHtml) {
      return `
        <article class="result-card glass" data-tool="${tool}">
          <div class="card-top">
            <h3 class="card-title">${titleHtml}</h3>
            <div class="card-meta"><span class="tool-chip"><i class="bi bi-check2"></i>${tool}</span>${timeNow()}</div>
          </div>
          ${bodyHtml}
        </article>`;
    }

    const stat = (label, value) => `
      <div class="col"><div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div></div>`;

    function renderWeatherCard(d) {
      return cardShell('get_weather',
        `<i class="bi bi-geo-alt-fill me-1"></i>${esc(d.city)}`,
        `<div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
           <div>
             <div class="temp">${d.temp}°C</div>
             <div class="dim mt-1">Cảm giác như ${d.feels}°C, ${esc(d.condition.toLowerCase())}</div>
           </div>
           <div class="wx-big"><i class="bi ${ICONS[d.icon]} wx-${d.icon}"></i></div>
         </div>
         <div class="row row-cols-2 row-cols-xl-4 g-2 mt-3">
           ${stat('Độ ẩm', d.humidity + '%')}
           ${stat('Gió', d.wind + ' km/h')}
           ${stat('Chỉ số UV', d.uv)}
           ${stat('Áp suất', d.pressure + ' hPa')}
         </div>`);
    }

    function renderForecastCard(d) {
      const tiles = d.days.map((x, i) => `
        <div class="day ${i === 0 ? 'today' : ''}">
          <div class="day-name">${esc(x.name)}</div>
          <i class="bi ${ICONS[x.icon]} wx-${x.icon} fs-2"></i>
          <div class="dim small">${esc(x.cond)}</div>
          <div class="fw-semibold">${x.hi}° / ${x.lo}°</div>
          <div class="rain">Mưa ${x.rain}%</div>
        </div>`).join('');
      return cardShell('get_forecast',
        `<i class="bi bi-calendar3 me-1"></i>Dự báo 5 ngày, ${esc(d.city)}`,
        `<div class="forecast-row">${tiles}</div>`);
    }

    function renderNewsCard(d) {
      const items = d.items.map(n => `
        <li class="news-item">
          <span class="news-ico"><i class="bi ${n.icon}"></i></span>
          <div>
            <div class="news-title">${esc(n.title)}</div>
            <div class="dim small mt-1">${esc(n.source)}, ${esc(n.time)}</div>
          </div>
        </li>`).join('');
      return cardShell('get_news',
        `<i class="bi bi-newspaper me-1"></i>Tin tức thời tiết`,
        `<ul class="news-list list-unstyled m-0">${items}</ul>`);
    }

    const RENDERERS = { get_weather: renderWeatherCard, get_forecast: renderForecastCard, get_news: renderNewsCard };

    /* =====================================================
       4. CHAT
       ===================================================== */
    const $ = id => document.getElementById(id);
    const messages = $('messages'), messagesArea = $('messagesArea'), results = $('results');
    const input = $('chatInput'), sendBtn = $('sendBtn'), testSelect = $('testSelect');

    const scrollChat = () => { messagesArea.scrollTop = messagesArea.scrollHeight; };

    function addMessage(role, html) {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.innerHTML = html;
      messages.appendChild(el);
      scrollChat();
      return el;
    }
    const addUser = text => addMessage('user', `<div class="bubble">${esc(text)}</div>`);
    const addBotPending = () => addMessage('bot',
      `<div class="bubble d-flex align-items-center gap-2">
         <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>Đang xử lý…
       </div>`);

    function fillBot(el, data) {
      const chips = data.toolCalls.map(c =>
        `<span class="tool-chip"><i class="bi bi-check2"></i>${esc(c.name)}</span>`).join('');
      el.innerHTML =
        (chips ? `<div class="chips">${chips}</div>` : '') +
        `<div class="bubble">${esc(data.reply || 'Mình chưa tìm được kết quả phù hợp. Bạn thử hỏi lại nhé.')}</div>`;
      scrollChat();
    }

    /* ===== Kết quả ===== */
    function renderResults(toolCalls) {
      if (!toolCalls.length) return;
      const empty = $('emptyState');
      if (empty) empty.remove();
      // Card mới nhất ở trên; tool gọi trước nằm trên cùng trong cùng một lượt
      [...toolCalls].reverse().forEach(c => {
        const fn = RENDERERS[c.name];
        if (!fn) return;
        results.insertAdjacentHTML('afterbegin', fn(c.result));
      });
      results.scrollTop = 0;
      notifyResults();
    }

    function clearResults() {
      results.innerHTML = `
        <div class="empty" id="emptyState">
          <i class="bi bi-cloud-sun"></i>
          Chưa có kết quả.<br>Hỏi về thời tiết, dự báo hoặc tin tức để xem tại đây.
        </div>`;
      $('resultDot').hidden = true;
    }

    /* ===== Gửi tin nhắn ===== */
    $('chatForm').addEventListener('submit', async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;

      addUser(text);
      input.value = '';
      sendBtn.disabled = true;
      const pending = addBotPending();

      try {
        const data = await callChat(text);
        fillBot(pending, data);
        renderResults(data.toolCalls);
      } catch (err) {
        console.error(err);
        pending.innerHTML = `<div class="bubble">Không lấy được dữ liệu. Kiểm tra kết nối rồi gửi lại nhé.</div>`;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    /* ===== Câu hỏi test ===== */
    testSelect.innerHTML = '<option value="">Câu hỏi test…</option>' +
      TEST_QUESTIONS.map((q, i) => `<option value="${i}">${esc(q.label)}</option>`).join('');
    testSelect.addEventListener('change', () => {
      if (testSelect.value === '') return;
      input.value = TEST_QUESTIONS[testSelect.value].text;   // chỉ điền vào ô nhập, chưa gửi
      testSelect.value = '';
      input.focus();
    });

    $('clearBtn').addEventListener('click', clearResults);

    /* ===== Tab mobile ===== */
    const isMobile = () => window.matchMedia('(max-width: 767.98px)').matches;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          const on = b === btn;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', on);
        });
        document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === btn.dataset.target));
        if (btn.dataset.target === 'panel-results') $('resultDot').hidden = true;
      });
    });
    function notifyResults() {
      // Có card mới khi đang ở tab Chat trên mobile: hiện chấm báo
      if (isMobile() && $('panel-chat').classList.contains('active')) $('resultDot').hidden = false;
    }

    /* ===== Khởi tạo ===== */
    addMessage('bot', '<div class="bubble">Chào bạn! Bạn muốn xem thời tiết ở đâu?</div>');
  </script>
</body>
</html>
